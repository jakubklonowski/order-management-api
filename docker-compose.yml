name: order-inventory-api

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: oms_php
    restart: unless-stopped
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    depends_on:
      database:
        condition: service_healthy
    networks:
      - oms_network

  # messenger:consume async worker; fresh clone crash-loops until vendor/ and messenger table exists
  # --time-limit and --memory-limit paired with restart policy for memory conservation
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: oms_worker
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -vv
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - oms_network

  nginx:
    image: nginx:stable-alpine
    container_name: oms_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - php
    networks:
      - oms_network

  database:
    image: mysql:8.4
    container_name: oms_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oms_network

  # http://localhost:${ADMINER_PORT}
  adminer:
    image: adminer:latest
    container_name: oms_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - database
    networks:
      - oms_network

  # http://localhost:${MAILPIT_PORT}
  mailpit:
    image: axllent/mailpit:latest
    container_name: oms_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - oms_network

networks:
  oms_network:
    driver: bridge

volumes:
  db_data:
