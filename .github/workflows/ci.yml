name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch cancels the run it supersedes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      database:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      # doctrine.yaml appends _test under when@test, so every step below
      # actually talks to order_management_test - the database the suite uses
      DATABASE_URL: "mysql://root:root_password@127.0.0.1:3306/order_management?serverVersion=8.4.0&charset=utf8mb4"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, zip, bcmath, ctype, iconv
          # same values as docker/php/conf.d/custom.ini
          ini-values: date.timezone=UTC, memory_limit=256M
          coverage: none

      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Create and migrate the test database
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction

      # the only check that catches a broken association mapping: the tests
      # do not, as Doctrine never validates mappedBy/inversedBy field names
      - name: Validate mappings against the schema
        run: php bin/console doctrine:schema:validate

      - name: Generate the JWT keypair
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Run tests
        run: php bin/phpunit
